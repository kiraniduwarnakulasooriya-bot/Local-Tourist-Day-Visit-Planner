<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Tourist Day-Visit Planner</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet Interactive Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navigation Bar with Admin Link -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Tourist Day Planner</a>
            <a href="admin.html" class="btn btn-outline-light fw-bold">Admin Panel</a>
        </div>
    </nav>

    <div class="container pb-4">
        <h2 class="text-center mb-4 text-primary fw-bold">Local Tourist Day-Visit Planner (Kandy Area)</h2>

        <!-- Search Input Field -->
        <input type="text" id="searchInput" class="form-control mb-2" placeholder="Search attraction by name..." onkeyup="loadAttractions()">

        <!-- Category Dropdown Filter  -->
        <select id="categorySelect" class="form-select mb-3" onchange="loadAttractions()">
            <option value="">All Categories</option>
            <option value="1">Religious</option>
            <option value="2">Historical</option>
            <option value="3">Nature</option>
            <option value="4">Viewpoint</option>
            <option value="5">Recreational</option>
        </select>

        <!-- Search Button -->
        <button class="btn btn-primary w-100" onclick="loadAttractions()">Search Places</button>

        <div class="row g-4">
            <!-- Attractions List -->
            <div class="col-md-7">
                <h4 class="fw-bold mb-3">Available Attractions</h4>
                <div id="attractionsList" class="row g-3"></div>
            </div>

            <!-- 1-Day Itinerary Planner & Map Panel -->
            <div class="col-md-5">
                <!-- Selected Itinerary Card -->
                <div class="card p-3 shadow-sm mb-4 border-0">
                    <h4 class="fw-bold text-success mb-3">My 1-Day Itinerary Plan</h4>
                    <ul id="selectedPlacesList" class="list-group mb-3">
                        <li class="list-group-item text-muted text-center" id="emptyMsg">No places added yet.</li>
                    </ul>

                    <!-- Total Distance Summary Box -->
                    <div class="alert alert-info d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-bold">Total Estimated Distance:</span>
                        <span id="totalDistance" class="badge bg-dark fs-6">0 km</span>
                    </div>

                    <button class="btn btn-success w-100 fw-bold py-2" onclick="generateItinerary()">Generate Optimal Route Plan</button>
                </div>

                <!-- Leaflet Dynamic Map Display -->
                <div class="card p-3 shadow-sm border-0">
                    <h5 class="fw-bold mb-2">Interactive Map Route Preview</h5>
                    <div id="map" style="height: 350px; border-radius: 12px;"></div>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
